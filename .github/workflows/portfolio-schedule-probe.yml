name: Portfolio schedule probe

on:
  schedule:
    # Bounded trial slots on 2026-11-05, 11:02 through 11:27 KST.
    - cron: '2,7,12,17,22,27 2 5 11 *'

permissions: {}

concurrency:
  group: portfolio-schedule-probe
  cancel-in-progress: false

jobs:
  record-scheduled-event:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Record the actual scheduled event
        env:
          OBSERVED_EVENT: ${{ github.event_name }}
          OBSERVED_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          if os.environ["OBSERVED_EVENT"] != "schedule":
              raise SystemExit("This probe requires a real schedule event.")
          planned = datetime(2026, 11, 5, 2, 2, tzinfo=timezone.utc)
          expires = datetime(2026, 11, 5, 2, 40, tzinfo=timezone.utc)
          observed = datetime.now(timezone.utc)
          # Cron has no year field. Expired runs report and disable this probe.
          valid = planned <= observed <= expires
          receipt = {
              "status": "SCHEDULE_OBSERVED" if valid else "PROBE_EXPIRED",
              "event": os.environ["OBSERVED_EVENT"],
              "schedule": os.environ["OBSERVED_SCHEDULE"],
              "trial_starts_at": planned.isoformat(),
              "trial_expires_at": expires.isoformat(),
              "observed_at": observed.isoformat(),
              "seconds_since_first_trial_slot": (observed - planned).total_seconds(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "collection_or_study_modified": False,
          }
          payload = json.dumps(receipt, indent=2) + "\n"
          (Path(os.environ["RUNNER_TEMP"]) / "portfolio-schedule-probe.json").write_text(payload)
          print(payload)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Temporary schedule probe\n\n```json\n" + payload + "```\n")
          PY
      - name: Preserve schedule receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-schedule-probe
          path: ${{ runner.temp }}/portfolio-schedule-probe.json
          retention-days: 7
          if-no-files-found: error

  stop-temporary-probe:
    needs: record-scheduled-event
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Disable only this probe after saving its scheduled receipt
        run: |
          gh api --method PUT "repos/$GH_REPO/actions/workflows/portfolio-schedule-probe.yml/disable"
          gh api "repos/$GH_REPO/actions/workflows/portfolio-schedule-probe.yml" --jq '{state, path}'
